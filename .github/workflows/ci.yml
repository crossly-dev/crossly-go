# Build, test and package on every push (any branch) and pull request.
#
# Managed by tools/sdk-repo/seed.mjs in the Crossly monorepo: edits here are overwritten on the next seed.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: false
      - name: build seller
        run: bash codegen/ci/check.sh go seller
      - name: build buyer
        run: bash codegen/ci/check.sh go buyer
      - name: webhook conformance vectors
        working-directory: codegen/integrations/webhooks/go
        run: cd checkvectors && go run .
      - name: package
        run: |
          V=$(node -p "require('./codegen/state.json').version")
          mkdir -p dist
          git add -A seller buyer webhooks
          tree=$(git write-tree)
          for m in seller buyer; do
            git archive --format=tar.gz --prefix="crossly-go-$m-$V/" -o "dist/crossly-go-$m-$V.tar.gz" "$tree:$m"
          done
          ls -l dist
